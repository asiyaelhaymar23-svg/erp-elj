# Blueprint Render : décrit toute la pile en un seul fichier.
# Dans le dashboard Render : New + -> Blueprint -> connecter ce dépôt.
# Render détecte ce fichier et propose de créer les 3 ressources ci-dessous.

databases:
  - name: erp-elj-db
    databaseName: elj
    user: elj
    plan: free

services:
  - type: web
    name: erp-elj-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: erp-elj-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      # URL publique du frontend (https://<nom-du-service>.onrender.com).
      # fromService: property: host renvoie le nom interne réseau privé de
      # Render, injoignable depuis le navigateur d'un utilisateur — donc
      # inutilisable ici malgré les apparences. Si tu renommes le service
      # erp-elj-frontend, mets cette valeur à jour en conséquence.
      - key: CORS_ORIGIN
        value: https://erp-elj-frontend.onrender.com

  - type: web
    name: erp-elj-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      # URL publique du backend (https://<nom-du-service>.onrender.com).
      # fromService: property: host renvoie le nom interne réseau privé de
      # Render, injoignable depuis le navigateur d'un utilisateur — donc
      # inutilisable ici malgré les apparences. Si tu renommes le service
      # erp-elj-backend, mets cette valeur à jour en conséquence.
      - key: VITE_API_URL
        value: https://erp-elj-backend.onrender.com
